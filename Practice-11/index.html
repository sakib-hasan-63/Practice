<!-- Quiz Application -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Quiz | Modern Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom glow & smooth transitions */
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-100 flex items-center justify-center font-sans">

  <div class="max-w-xl w-full mx-4 my-10">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <span class="px-3 py-1 text-xs font-semibold tracking-wider text-cyan-400 bg-cyan-950/60 border border-cyan-800/50 rounded-full uppercase">
        Interactive Test
      </span>
      <h1 class="text-4xl font-extrabold tracking-tight mt-3 bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
        JavaScript Quiz
      </h1>
      <p class="text-slate-400 text-sm mt-1">
        Challenge your skills and master the concepts
      </p>
    </div>

    <!-- Quiz Card -->
    <div id="quizCard" class="glass-card rounded-3xl p-8 transition-all duration-300">
      
      <!-- Top Info -->
      <div class="flex justify-between items-center mb-6">
        <span id="questionNumber" class="text-cyan-400 font-semibold text-sm tracking-wide">
          Question 1/5
        </span>
        <span id="score" class="text-xs font-medium px-3 py-1 bg-slate-800 text-slate-300 rounded-full border border-slate-700">
          Score: 0
        </span>
      </div>

      <!-- Progress Bar -->
      <div class="w-full bg-slate-800/80 h-2.5 rounded-full mb-8 overflow-hidden p-0.5">
        <div id="progress" class="h-full bg-gradient-to-r from-cyan-500 to-indigo-500 rounded-full transition-all duration-500" style="width: 20%"></div>
      </div>

      <!-- Question -->
      <h2 id="question" class="text-xl md:text-2xl font-semibold mb-8 text-slate-200 leading-snug">
        <!-- Question injected via JS -->
      </h2>

      <!-- Options -->
      <div id="options" class="space-y-3.5">
        <!-- Options injected via JS -->
      </div>

      <!-- Next Button -->
      <button id="nextBtn" class="hidden mt-8 w-full bg-gradient-to-r from-cyan-500 to-indigo-600 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/40 hover:scale-[1.01] active:scale-[0.99] transition-all duration-200">
        Next Question →
      </button>

    </div>

    <!-- Result Card -->
    <div id="result" class="hidden glass-card rounded-3xl p-10 text-center transition-all duration-300">
      <div class="w-16 h-16 bg-cyan-400/10 border border-cyan-500/30 text-cyan-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        🎉
      </div>
      <h2 class="text-3xl font-extrabold text-slate-100">
        Quiz Completed!
      </h2>
      <p class="text-slate-400 text-sm mt-2">
        Here is your final performance summary
      </p>

      <div class="my-6 py-4 bg-slate-900/60 border border-slate-800 rounded-2xl">
        <span class="text-xs text-slate-400 uppercase tracking-widest block font-medium">Final Score</span>
        <h3 id="finalScore" class="text-5xl font-black text-cyan-400 mt-1">
          <!-- Score injected via JS -->
        </h3>
      </div>

      <button id="restartBtn" class="w-full bg-gradient-to-r from-cyan-500 to-indigo-600 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/40 hover:scale-[1.01] active:scale-[0.99] transition-all duration-200">
        Try Again ↺
      </button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
