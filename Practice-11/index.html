<!--  Quiz Application -->

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>JavaScript Quiz</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-slate-950 text-white">

  <div class="max-w-3xl mx-auto px-5 py-10">

    <div class="text-center mb-8">

      <h1 class="text-4xl font-bold">
        JavaScript Quiz
      </h1>

      <p class="text-slate-400 mt-2">
        Test your JavaScript knowledge
      </p>

    </div>


    <div id="quizCard"
      class="bg-slate-900 rounded-3xl p-7">

      <div class="flex justify-between mb-6">

        <span id="questionNumber"
          class="text-cyan-400 font-bold">
          Question 1/5
        </span>

        <span id="score"
          class="text-slate-400">
          Score: 0
        </span>

      </div>


      <div class="w-full bg-slate-800 h-2 rounded-full mb-8">

        <div
          id="progress"
          class="h-2 bg-cyan-500 rounded-full"
          style="width: 20%">
        </div>

      </div>


      <h2 id="question"
        class="text-2xl font-bold mb-7">
      </h2>


      <div id="options"
        class="space-y-4">
      </div>


      <button
        id="nextBtn"
        class="hidden mt-7 w-full
        bg-cyan-500 text-slate-950
        font-bold py-3 rounded-xl
        hover:bg-cyan-400">
        Next Question
      </button>

    </div>


    <div id="result"
      class="hidden bg-slate-900 rounded-3xl
      p-10 text-center">

      <h2 class="text-4xl font-bold">
        Quiz Completed 🎉
      </h2>

      <p class="text-slate-400 mt-4">
        Your Final Score
      </p>

      <h3 id="finalScore"
        class="text-6xl font-bold text-cyan-400 my-5">
      </h3>

      <button
        id="restartBtn"
        class="bg-cyan-500 text-slate-950
        font-bold px-8 py-3 rounded-xl">
        Restart Quiz
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
