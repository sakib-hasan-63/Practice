<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Store</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">

            <h1 class="text-2xl font-bold text-blue-700">
                Simple Store
            </h1>

            <button id="cartButton"
                class="relative bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                🛒 Cart

                <span id="cartCount"
                    class="absolute -top-2 -right-2 bg-red-550 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">
                    0
                </span>
            </button>

        </div>
    </header>


    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8">

        <div class="mb-8">
            <h2 class="text-3xl font-bold">
                Our Products
            </h2>

            <p class="text-gray-550 mt-2">
                Choose your favorite products and add them to cart.
            </p>
        </div>


        <!-- Products -->
        <div id="productList"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>


        <!-- Cart Section -->
        <section id="cartSection"
            class="hidden mt-12 bg-white rounded-xl shadow-md p-6">

            <div class="flex justify-between items-center mb-6">

                <h2 class="text-2xl font-bold">
                    Shopping Cart
                </h2>

                <button id="closeCart"
                    class="text-gray-500 hover:text-red-500 text-xl">
                    ✕
                </button>

            </div>


            <!-- Cart Items -->
            <div id="cartItems" class="space-y-4">
            </div>


            <!-- Total -->
            <div class="border-t mt-6 pt-5 flex justify-between items-center">

                <div>
                    <p class="text-gray-500">
                        Total Amount
                    </p>

                    <h3 id="cartTotal"
                        class="text-2xl font-bold text-green-600">
                        ₹0
                    </h3>
                </div>

                <button id="checkoutButton"
                    class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700">
                    Checkout
                </button>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
