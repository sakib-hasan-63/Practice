<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 - Product Inventory Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 30px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-left: 5px solid #3498db;
        }

        .metric-card.accent {
            border-left-color: #2ecc71;
        }

        .metric-card h3 {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .metric-card p {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Product Table */
        .table-container {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        .table-container h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #34495e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ecf0f1;
        }

        th {
            background-color: #f8f9fa;
            color: #7f8c8d;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        /* Status Badges */
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-success {
            background-color: #e8f8f5;
            color: #27ae60;
        }

        .badge-danger {
            background-color: #fde2e2;
            color: #e74c3c;
        }

        .badge-star {
            background-color: #fef9e7;
            color: #f39c12;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Product Inventory Dashboard</h1>

        <!-- High-level Summary Metrics -->
        <div class="metrics-grid">
            <div class="metric-card">
                <h3>Total Inventory Value</h3>
                <p id="total-val">₹0</p>
            </div>
            <div class="metric-card accent">
                <h3>Highest Rated Product</h3>
                <p id="best-prod">-</p>
            </div>
            <div class="metric-card">
                <h3>Available Items</h3>
                <p id="avail-count">0</p>
            </div>
            <div class="metric-card">
                <h3>Premium (> ₹10k)</h3>
                <p id="expensive-count">0</p>
            </div>
        </div>

        <!-- Detailed Product List -->
        <div class="table-container">
            <h2>All Products Catalog</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Rating</th>
                        <th>Stock Status</th>
                    </tr>
                </thead>
                <tbody id="product-table-body">
                    <!-- Data will be populated by JS -->
                </tbody>
            </table>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
