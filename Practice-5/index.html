<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 3 - Task Manager</title>
  <style>
    /* Basic Page Setup */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      padding-top: 50px;
      margin: 0;
    }

    /* Task Manager Card Container */
    div {
      background: white;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
    }

    h1 {
      margin-top: 0;
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }

    /* Input Fields & Buttons */
    input[type="text"] {
      width: 60%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }

    select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
      background: #fff;
    }

    button#addTask {
      padding: 10px 14px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-left: 4px;
      transition: background 0.2s;
    }

    button#addTask:hover {
      background-color: #0056b3;
    }

    /* Task List Styling */
    ul#taskList {
      list-style-type: none;
      padding: 0;
      margin-top: 20px;
    }

    ul#taskList li {
      background: #f8f9fa;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #007bff;
    }

    ul#taskList li span {
      cursor: pointer;
      flex-grow: 1;
      margin-right: 10px;
    }

    ul#taskList li strong {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      margin-right: 10px;
    }

    /* Delete Button inside Li */
    ul#taskList li button {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    ul#taskList li button:hover {
      background-color: #bd2130;
    }
  </style>
</head>
<body>

  <!-- AAPKA EXACT JS CODE HERE -->
  <script>
    // DAY 3 — DOM + Events
    // File: day-3-task-manager.js

    const app = document.createElement("div");

    app.innerHTML = `
      <h1>Task Manager</h1>

      <input
        id="taskInput"
        type="text"
        placeholder="Enter your task"
      />

      <select id="priority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <button id="addTask">Add Task</button>

      <ul id="taskList"></ul>
    `;

    document.body.appendChild(app);

    const taskInput = document.querySelector("#taskInput");
    const priority = document.querySelector("#priority");
    const addTask = document.querySelector("#addTask");
    const taskList = document.querySelector("#taskList");

    let tasks = [];

    const renderTasks = () => {
      taskList.innerHTML = "";

      tasks.forEach(task => {
        const li = document.createElement("li");

        li.innerHTML = `
          <span>${task.title}</span>
          <strong>[${task.priority}]</strong>
          <button data-id="${task.id}">
            Delete
          </button>
        `;

        if (task.completed) {
          li.style.textDecoration = "line-through";
          li.style.opacity = "0.6";
        }

        li.querySelector("span").addEventListener("click", () => {
          task.completed = !task.completed;
          renderTasks();
        });

        li.querySelector("button").addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          renderTasks();
        });

        taskList.appendChild(li);
      });
    };

    addTask.addEventListener("click", () => {
      const title = taskInput.value.trim();

      if (!title) {
        alert("Please enter a task");
        return;
      }

      const task = {
        id: Date.now(),
        title,
        priority: priority.value,
        completed: false
      };

      tasks.push(task);

      taskInput.value = "";

      renderTasks();
    });

    taskInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        addTask.click();
      }
    });
  </script>

</body>
</html>
