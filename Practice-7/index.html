<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - Async JS & API</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JS File Connection -->
    <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 text-slate-800">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Header -->
        <h1 class="text-3xl font-bold text-center text-slate-900 border-b pb-4 border-slate-300">
            Day 5 — Async JavaScript Dashboard
        </h1>

        <!-- Part 1: Login Simulation Section -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
            <h2 class="text-xl font-semibold text-slate-800 border-b-2 border-blue-500 pb-2 inline-block mb-4">
                1. Login Simulation (Promise)
            </h2>
            
            <div class="flex flex-col sm:flex-row gap-3">
                <input 
                    type="text" 
                    id="usernameInput" 
                    placeholder="Username (sakib)" 
                    class="border border-slate-300 p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 flex-1"
                />
                <input 
                    type="password" 
                    id="passwordInput" 
                    placeholder="Password (12345)" 
                    class="border border-slate-300 p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 flex-1"
                />
                <button 
                    id="loginBtn" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg transition duration-200"
                >
                    Login
                </button>
            </div>

            <!-- Login Status Message -->
            <div id="loginStatus" class="mt-4 p-3 rounded-lg text-sm font-medium hidden"></div>
        </div>

        <!-- Part 2: API Users Section -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
            <h2 class="text-xl font-semibold text-slate-800 border-b-2 border-emerald-500 pb-2 inline-block mb-4">
                2. Fetch Top 5 Users (API Integration)
            </h2>

            <!-- Cards Grid -->
            <div id="usersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-2">
                <p class="text-blue-600 font-medium col-span-full">Loading users from API...</p>
            </div>
        </div>

    </div>

</body>
</html>
